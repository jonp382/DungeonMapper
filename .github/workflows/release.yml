name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            exe: DungeonMapper.exe
          - rid: linux-x64
            os: ubuntu-latest
            exe: DungeonMapper
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: bash
        run: >
          dotnet publish DungeonMapper/DungeonMapper.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -o out
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=true
          -p:TrimmerRootAssembly=DungeonMapper
          -p:InvariantGlobalization=true
          -p:DebugType=none
          -p:InformationalVersion=${{ github.ref_name }}

      - name: Rename
        shell: bash
        run: |
          mkdir dist
          ext="${{ matrix.exe }}"; ext="${ext#DungeonMapper}"
          cp "out/${{ matrix.exe }}" "dist/DungeonMapper-${{ github.ref_name }}-${{ matrix.rid }}${ext}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history and tags, needed to find the previous tag

      - name: Release notes
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          # the tag's actions/checkout copy is lightweight, fetch the real one so an annotated message is readable
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          {
            # annotated tag message (git tag -a v1.0.0 -m "..."), if there is one
            if [ "$(git cat-file -t "$tag")" = "tag" ]; then
              git tag -l --format='%(contents)' "$tag"
              echo
            fi
            prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
            if [ -n "$prev" ]; then
              echo "## Changes since $prev"
              range="$prev..$tag"
            else
              echo "## Changes"
              range="$tag"
            fi
            echo
            git log --no-merges --reverse --pretty='- %s' "$range"
          } > notes.md
          cat notes.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
